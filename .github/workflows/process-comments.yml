name: Process community comments

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bake comments into module JSONs
        run: node scripts/bake-comments.js

      - name: Process and triage comments
        run: node scripts/process-comments.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/modules/*.json Tasks/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Process community comments: bake + triage + apply"
            git push
          fi
